<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Split Calculator</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}
body{
    background:#f4f4f4;
    margin:0;
    padding:20px;
}
.container{
    max-width:760px;
    margin:auto;
    background:#fff;
    padding:24px;
    border-radius:12px;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
}
h1{
    margin-top:0;
}
.grid{
    display:grid;
    grid-template-columns:180px 1fr;
    gap:12px;
    align-items:center;
}
input,select{
    width:100%;
    padding:8px;
    font-size:16px;
}
.slider-wrap{
    display:flex;
    gap:12px;
    align-items:center;
}
input[type=range]{
    flex:1;
}
.output{
    margin-top:24px;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:8px;
    border-bottom:1px solid #ddd;
    text-align:right;
}
th:first-child,
td:first-child{
    text-align:left;
}
.note{
    margin-top:8px;
    color:#666;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>Running Split Calculator</h1>

<div class="grid">

<label>Unit</label>
<select id="unit">
<option value="metric">Metric (km)</option>
<option value="imperial">Imperial (mi)</option>
</select>

<label>Distance</label>
<input id="distance" type="number" value="10" min="0.1" step="0.1">

<label>Target Goal Time</label>
<input id="goal" type="text" value="00:50:00">

<label>Average Pace</label>
<input id="pace" type="text" value="05:00">

<label>Split <span id="splitLabel">(Even)</span></label>
<div class="slider-wrap">
<input id="splitSlider" type="range" min="0" max="100" value="50">
</div>

<label>Split Percentage</label>
<input id="splitPercent" readonly>

</div>

<div class="output">

<h2>Splits</h2>

<table>
<thead>
<tr>
<th>Lap</th>
<th>Pace</th>
<th>Cumulative Time</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<div class="note">
50 = Even Split • Left = Positive Split • Right = Negative Split • Maximum adjustment = ±10%
</div>

</div>

</div>

<script>

const unit=document.getElementById("unit");
const distance=document.getElementById("distance");
const goal=document.getElementById("goal");
const pace=document.getElementById("pace");
const slider=document.getElementById("splitSlider");
const splitPercent=document.getElementById("splitPercent");
const splitLabel=document.getElementById("splitLabel");
const tbody=document.getElementById("tableBody");

let updating=false;

function parseTime(str){
    let p=str.split(":").map(Number);

    if(p.length===2){
        return p[0]*60+p[1];
    }

    if(p.length===3){
        return p[0]*3600+p[1]*60+p[2];
    }

    return 0;
}

function formatHMS(sec){

    sec=Math.round(sec);

    let h=Math.floor(sec/3600);
    let m=Math.floor((sec%3600)/60);
    let s=sec%60;

    return (
        String(h).padStart(2,"0")+":"+
        String(m).padStart(2,"0")+":"+
        String(s).padStart(2,"0")
    );
}

function formatPace(sec){

    sec=Math.round(sec);

    let m=Math.floor(sec/60);
    let s=sec%60;

    return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function getSplit(){

    // maps 0-100 to +20% to -20%

    return (50-slider.value)/50*10;
}

function updateSplitText(){

    let p=getSplit();

    splitPercent.value=p.toFixed(1)+"%";

    if(Math.abs(p)<0.01){
        splitLabel.textContent="(Even)";
    }else if(p>0){
        splitLabel.textContent="(Positive)";
    }else{
        splitLabel.textContent="(Negative)";
    }

}

function updateFromGoal(){

    if(updating) return;
    updating=true;

    let dist=parseFloat(distance.value)||0;

    let total=parseTime(goal.value);

    let avg=total/dist;

    pace.value=formatPace(avg);

    updating=false;

    calculate();

}

function updateFromPace(){

    if(updating) return;
    updating=true;

    let dist=parseFloat(distance.value)||0;

    let sec=parseTime(pace.value);

    goal.value=formatHMS(sec*dist);

    updating=false;

    calculate();

}

function calculate(){

    updateSplitText();

    tbody.innerHTML="";

    let dist=parseFloat(distance.value);

    if(!dist||dist<=0) return;

    let avg=parseTime(pace.value);

    let split=getSplit()/100;

    let laps=Math.round(dist);

    if(laps<1) laps=1;

    let firstFactor=1 - split;
    let secondFactor=1 + split;

    let cum=0;

    for(let i=1;i<=laps;i++){

        let ratio=(i-1)/(laps-1||1);

        let factor=firstFactor+(secondFactor-firstFactor)*ratio;

        let lapTime=avg*factor;

        cum+=lapTime;

        let row=document.createElement("tr");

        row.innerHTML=`
        <td>${i}</td>
        <td>${formatPace(lapTime)}</td>
        <td>${formatHMS(cum)}</td>
        `;

        tbody.appendChild(row);

    }

}

goal.addEventListener("input",updateFromGoal);
pace.addEventListener("input",updateFromPace);
distance.addEventListener("input",updateFromGoal);
slider.addEventListener("input",calculate);
unit.addEventListener("change",calculate);

updateFromPace();

</script>

</body>
</html>
